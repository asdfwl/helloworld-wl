<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World！- 王淋的第一个AI网站</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .card {
      width: 100%;
      max-width: 640px;
      padding: 56px 48px 52px;
      text-align: center;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(35, 24, 78, 0.35);
      animation: fadeInUp 0.8s ease both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(28px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .title {
      margin-bottom: 18px;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #764ba2;
    }

    .subtitle {
      margin-bottom: 40px;
      font-size: 19px;
      line-height: 1.6;
      color: #5a5a6e;
    }

    .subtitle .name {
      font-weight: 700;
      color: #764ba2;
    }

    .time-label {
      margin-bottom: 12px;
      font-size: 13px;
      letter-spacing: 3px;
      color: #9a9ab0;
    }

    .time-value {
      display: inline-block;
      min-width: 300px;
      padding: 18px 30px;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 24px;
      letter-spacing: 2px;
      color: #a6e3a1;
      background: #1f2233;
      border-radius: 14px;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="title">Hello World！</h1>
    <p class="subtitle">我是<span class="name">【王淋】</span>，我的第一个AI开发的网站</p>

    <p class="time-label">当前服务器时间</p>
    <div class="time-value" id="server-time">--:--:--</div>
  </main>

  <script>
    // 每隔 1 秒向服务器请求一次时间，实时刷新页面显示
    async function updateServerTime() {
      try {
        const response = await fetch('/api/server-time');
        const data = await response.json();
        document.getElementById('server-time').textContent = data.time;
      } catch (error) {
        document.getElementById('server-time').textContent = '获取服务器时间失败';
      }
    }

    updateServerTime();                  // 打开页面时立即获取一次
    setInterval(updateServerTime, 1000); // 之后每秒自动刷新
  </script>
</body>
</html>
